<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Selamat Datang di Web Saya!</h1>
    <p>Ini adalah aplikasi web pertama saya yang di-hosting di GitHub Pages.</p>
    <button onclick="sapa()">Klik Saya</button>

    <script>
        function sapa() {
            alert("Halo! Terima kasih telah mengunjungi web ini.");
        }
    </script>

</body>
</html>
